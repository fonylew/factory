[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-software-factory"
version = "0.1.0"
description = "Enterprise Multi-Agent Spec-Driven Software Factory System for Technical Leads and System Analysts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "networkx>=3.3",
    "click>=8.1.7",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-bdd>=7.1.2",
]

[project.scripts]
factory = "factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
